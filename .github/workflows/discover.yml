name: weekly source check
# Re-checks catalog license pages and lists new CC0 source candidates from
# Openverse (scripts/discover.mjs), then posts the report to one open issue
# labeled "source-check". Candidates still need human verification.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discover.mjs > report.md
      - name: Post report to the source-check issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-check --color 0e8a16 --description "Weekly CC0 source check" 2>/dev/null || true
          number=$(gh issue list --label source-check --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Weekly CC0 source check" --label source-check --body-file report.md
          fi
