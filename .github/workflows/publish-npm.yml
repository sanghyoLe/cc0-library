name: publish npm
# Publishes the package to npm and the server metadata to the MCP Registry
# when a version tag (v*) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored. The package's
# npmjs.com settings must list this repository and this workflow file
# (publish-npm.yml) as a trusted publisher.
# The MCP Registry step logs in with GitHub OIDC (no stored token).
# Last, it creates the GitHub release for the tag with generated notes, unless
# a release for that tag already exists (for example one written by hand).
# Docs: https://docs.npmjs.com/trusted-publishers/
#       https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and MCP Registry login
    env:
      # Pinned on purpose; bump deliberately (the Sigstore check below is tied to this tag).
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish to npm (skipped if this version is already on npm)
        shell: bash
        run: |
          set -o pipefail
          v="$(node -p "require('./package.json').version")"
          if npm view "cc0-library-mcp@$v" version >/dev/null 2>&1; then
            echo "cc0-library-mcp@$v is already on npm; skipping."
          elif ! npm publish --access public 2>&1 | tee publish.log; then
            # A version waiting for maintainer approval (npm staged publishing) cannot be re-published.
            if grep -q "previously staged version" publish.log; then
              echo "::notice::cc0-library-mcp@$v is staged on npm and waits for a maintainer to approve it on npmjs.com."
            else
              exit 1
            fi
          fi
      - name: Wait until npm serves this version (the MCP Registry checks it)
        run: |
          v="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            npm view "cc0-library-mcp@$v" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::cc0-library-mcp@$v is not on npm yet. If it is staged, approve it on npmjs.com, then re-run this workflow." >&2
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Create the GitHub release (skipped if it exists)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
